<style>
:root{--bg:#0E0F11;--card:#1A1C20;--card2:#22252A;--line:#2A2D33;--fg:#F2F2F0;--mute:#9A9DA3;--dim:#5A5E66;--go:#F5C518;--goS:rgba(245,197,24,.12);--ink:#141210;--a:#3DDC97;--aS:rgba(61,220,151,.12);--b:#6CB4FF;--bS:rgba(108,180,255,.13);--x:#FF5C5C;--xS:rgba(255,92,92,.13);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:disabled{opacity:.4;cursor:default}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 180px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px}.logo{display:flex;gap:8px;align-items:center;font-family:Mitr;font-weight:600;font-size:21px}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}.tabs button{min-height:44px;font-size:14px;padding:0 2px;border-radius:12px;border:1px solid var(--line);font-family:Mitr;font-weight:500}.tabs .on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.trio div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}.trio .v{font-family:'JetBrains Mono';font-size:28px;font-weight:700}

table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}

.lbl{font-size:12px;letter-spacing:.04em;color:var(--mute);font-weight:600;margin-top:4px}
.tc{display:flex;flex-direction:column;gap:10px}.tc.now{border-color:var(--go);box-shadow:0 0 0 1px var(--go),0 0 28px rgba(245,197,24,.18)}.tc.done{opacity:.72}.tc.ev{background:transparent;border-style:dashed;padding:10px 14px}
.tc h3{margin:0;font-family:Mitr;font-weight:500;font-size:19px}.rowb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}.pill.go{color:var(--ink);background:var(--go);border-color:var(--go)}.pill.ok{color:var(--fg);background:var(--card2)}.pill.warn{color:var(--x);border-color:rgba(255,92,92,.5)}
.tagA{font-family:'JetBrains Mono';font-weight:700;font-size:12px;padding:2px 7px;border-radius:7px;color:var(--a);background:var(--aS)}.tagB{font-family:'JetBrains Mono';font-weight:700;font-size:12px;padding:2px 7px;border-radius:7px;color:var(--b);background:var(--bS)}
.task{display:flex;gap:12px;align-items:flex-start}.task .dn{width:50px;text-align:center;flex:none}.task .dn b{display:block;font-family:'JetBrains Mono';font-size:22px;line-height:1.1}.task .dn small{font-size:11px;color:var(--mute)}.task.hot{border-color:var(--go)}.task.hot .dn b{color:var(--go)}

.rg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rg button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:'JetBrains Mono';font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.rg button small{font-family:'IBM Plex Sans Thai';font-size:10px;color:var(--mute)}.rg .d{background:var(--card2)}.rg .d small{color:var(--a)}.rg .p{border-color:var(--go)}.rg .p small{color:var(--go)}.rg .n{border-style:dashed;color:var(--dim)}
.checks{display:flex;flex-direction:column;gap:7px;font-size:14px}.checks div{display:flex;gap:8px;align-items:flex-start}.checks i{color:var(--go);font-style:normal;font-weight:700}
.fl{display:flex;gap:8px}.fl>*{flex:1}.ftag{border-radius:12px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;text-align:center;padding:0 6px}.ftag.send{background:var(--fg);color:var(--bg)}.ftag.keep{border:1px solid var(--line);color:var(--mute);background:none}.ftag.wait{border:1px dashed var(--dim);color:var(--dim)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{min-height:38px;border-radius:9px;font-size:14px;color:var(--mute)}.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
.paperwrap{overflow-x:auto;border-radius:10px}.paper{background:#FBFAF7;color:#1B1B1B;padding:18px 14px;font-family:'Sarabun','TH Sarabun New','IBM Plex Sans Thai',sans-serif;font-size:12px;line-height:1.45;min-width:560px}.paper h4{text-align:center;margin:0 0 2px;font-size:14px}.paper .meta{text-align:center;font-size:11px;margin-bottom:10px;color:#333}.paper table{border-collapse:collapse;width:100%}.paper th,.paper td{border:1px solid #9b9b9b;padding:3px 4px;text-align:center;color:#1B1B1B;background:none}.paper th{background:#eceae4;font-weight:600}.paper td:first-child,.paper th:first-child{text-align:left;white-space:nowrap}.paper .hl{background:#fff4c2;font-weight:700}.paper p{margin:6px 0}.paper .sec{font-weight:700;margin-top:8px}

.termw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);-webkit-overflow-scrolling:touch}.term{border-collapse:separate;border-spacing:0}.term th,.term td{padding:3px;text-align:center}.term thead th{font-weight:500;font-size:11px;color:var(--mute);white-space:nowrap;min-width:46px;padding:8px 3px 6px}.term thead th b{display:block;font-family:Mitr;font-weight:500;font-size:13px;color:var(--fg)}.term thead th.cur b{color:var(--go)}
.term .rm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:3px 8px 3px 10px;border-right:1px solid var(--line);white-space:nowrap;min-width:62px}.term .rm b{display:block;font-family:Mitr;font-weight:500;font-size:14px}.term .rm small{font-size:10px;color:var(--mute);font-family:'JetBrains Mono'}
.cl{width:40px;height:36px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono';font-size:13px;border:1px solid transparent;margin:0 auto}.cl.done{background:var(--aS);color:var(--a);border-color:rgba(61,220,151,.4)}.cl.miss{background:var(--xS);color:var(--x);border-color:rgba(255,92,92,.45)}.cl.now{border-color:var(--go);color:var(--go)}.cl.fut{background:var(--card2);color:var(--dim)}.cl.off{color:var(--dim);font-size:10px;font-family:'IBM Plex Sans Thai';background:repeating-linear-gradient(45deg,#2a2d33 0 3px,#16181b 3px 6px)}.cl.none{background:none}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.legend span{display:flex;align-items:center;gap:5px}.legend .cl{width:18px;height:18px;border-radius:5px;margin:0}

.wks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.wkb{flex:none;width:62px;padding:7px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:1px}.wkb b{font-family:Mitr;font-weight:500;font-size:14px}.wkb small{font-size:10px;color:var(--mute)}.wkb .cn{font-family:'JetBrains Mono'}.wkb .cn.good{color:var(--a)}.wkb.cur{border-color:var(--go)}.wkb.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.wkb.on small{color:#555}
.drs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dr{min-height:62px;border-radius:11px;border:1px solid var(--line);background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px}.dr:disabled{opacity:1}.dr b{font-family:'JetBrains Mono';font-size:15px}.dr small{font-size:11px;color:var(--mute)}.dr .st{font-size:11px}.dr.done{background:var(--aS);border-color:rgba(61,220,151,.4)}.dr.done .st{color:var(--a)}.dr.miss{background:var(--xS);border-color:rgba(255,92,92,.45)}.dr.miss .st{color:var(--x)}.dr.now{border-color:var(--go)}.dr.now .st{color:var(--go)}.dr.fut{opacity:.55}.dr.off{background:repeating-linear-gradient(45deg,#2a2d33 0 3px,#16181b 3px 6px)}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>
<script>
var LOGO='<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#F5C518" stroke-width="2"><circle cx="13" cy="13" r="7.5"/><path d="M13 1.5v23M1.5 13h23"/></svg>';
var DAYS=['','จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
var MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var S={pin:'',me:null,w:1,wd:null,tab:'today',room:null,date:null,late:0,song:'',note:'',marks:{},hist:[],prev:null,busy:false};
var $=function(id){return document.getElementById(id)};
var each=function(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dock(h){if(h){$('dockIn').innerHTML=h;$('dock').hidden=false}else $('dock').hidden=true}
/* ---------- คุยกับระบบ: ใน Google ใช้ google.script.run / นอก Google (GitHub Pages) ใช้ fetch ไปที่ลิงก์ /exec ---------- */
var API_URL='https://script.google.com/macros/s/AKfycby62UBWxk9uc-3WwAeoDvr-LuMht2lrfnxPD0vnm3TPJ6u06AcaFaSPtB0CoQWldHt0dw/exec';
var HAS_GAS=!!(window.google&&google.script&&google.script.run);
function rpc(fn,args){
 if(HAS_GAS)return new Promise(function(ok,no){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(no);r[fn].apply(r,args)});
 return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
  .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.e);return j.v})}
function isNet(e){return /Failed to fetch|NetworkError|Load failed|network|timeout/i.test(e&&e.message||String(e))}
function errText(e){return isNet(e)?'เน็ตหลุด ลองใหม่อีกครั้ง':(e&&e.message||String(e))}
function call(fn,args,ok,fail){S.busy=true;rpc(fn,args).then(function(v){S.busy=false;ok(v)},function(e){S.busy=false;var m=$('err');var t=errText(e);if(m)m.textContent=t;else alert(t);if(fail)fail(e)})}
/* ---------- จำไว้ในเครื่อง (เข้าแอปครั้งต่อไปขึ้นทันที) ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function lsJSON(k){try{return JSON.parse(lsGet(k)||'null')}catch(e){return null}}
function todayLocal(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
/* ---------- คิวบันทึก: กดบันทึกแล้วไปต่อได้ทันที ส่งเบื้องหลัง เน็ตหลุดส่งซ้ำเอง ---------- */
function qGet(){return lsJSON('coda_q')||[]}
function qSet(q){lsSet('coda_q',q.length?JSON.stringify(q):null)}
var flushing=false,flushTimer=null;
function flush(){if(flushing)return;var q=qGet();updQ();if(!q.length)return;flushing=true;var it=q[0];
 rpc('save',[it.pin,it.data]).then(function(v){var q2=qGet();q2.shift();qSet(q2);flushing=false;S.lastSent=v.at;updQ();flush()},
  function(e){flushing=false;if(!isNet(e)){var q2=qGet();q2.shift();qSet(q2);alert('บันทึก ป.'+it.data.room+' ไม่สำเร็จ: '+errText(e)+'\nเปิดห้องนี้แล้วบันทึกใหม่อีกครั้ง')}
   updQ();clearTimeout(flushTimer);flushTimer=setTimeout(flush,15000)})}
function updQ(){var n=qGet().length;each('.qs',function(el){el.innerHTML=n?'<span style="color:var(--go)">⏳ กำลังส่งเข้าชีต '+n+' ห้อง…</span>':(S.lastSent?'<span style="color:var(--a)">✓ ส่งเข้าชีตแล้ว '+esc(S.lastSent.slice(-5))+'</span>':'')})}
window.addEventListener('online',flush);

/* ---------- วันที่ ---------- */
function d2n(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function n2d(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2)}
function thd(s){if(!s)return'';var p=s.split('-');return (+p[2])+' '+MON[+p[1]-1]}
function dow(s){var d=new Date(d2n(s)*864e5).getUTCDay();return d===0?7:d}
function weekOf(s){return Math.floor((d2n(s)-d2n(S.me.termStart))/7)+1}
function roomDate(room,w){var t=S.me.timetable[room];return t&&t.day?n2d(d2n(S.me.termStart)+(w-1)*7+t.day-1):''}
function offOf(room,date){if(!date)return null;var o=S.me.off.filter(function(o){return o.date===date&&(!o.rooms.length||o.rooms.indexOf(room)>=0)});return o[0]||null}
function planG(w,g){return S.me.plans.filter(function(p){return p.week===w&&String(p.grade||'4')===g})[0]||null}
function planOf(w){return planG(w,'4')}
function clean(s){return String(s).replace(/^[-•\s]+/,'')}
function sortedRooms(){var tt=S.me.timetable,k=function(r){var t=tt[r]||{};return (t.day||9)*100+(parseInt(t.period,10)||99)};return S.me.rooms.slice().sort(function(a,b){return k(a)-k(b)||a.localeCompare(b,"th",{numeric:true})})}
/* ครูหลัก + ผู้ดูแล เห็นทุกหน้า · การตั้งค่าและลิงก์ชีตอยู่ที่ครูหลักคนเดียว (Apps Script กันอีกชั้น) */
function isOwner(){return S.me.role==='ครูหลัก'||S.me.role==='ผู้ดูแล'}
/* ชั้นเรียน: ครูหลักสลับ ป.4/5/6 ด้วยแถบบนหน้า · ครูแทนเห็นทุกห้องของตนในรายการเดียว */
function gradeOf(r){return String(r).split('/')[0]}
function grades(){var o=[];S.me.rooms.forEach(function(r){var g=gradeOf(r);if(o.indexOf(g)<0)o.push(g)});return o.sort()}
function useGradeBar(){return isOwner()&&grades().length>1}
function curGrade(){var a=grades();return S.grade&&a.indexOf(S.grade)>=0?S.grade:(a.indexOf('4')>=0?'4':a[0])}
function shownRooms(){var g=curGrade();return useGradeBar()?sortedRooms().filter(function(r){return gradeOf(r)===g}):sortedRooms()}
function gradeBar(){return useGradeBar()?'<div class="chips" id="gb">'+grades().map(function(g){return '<button class="chip '+(curGrade()===g?'on':'')+'" data-g="'+g+'">ป.'+g+'</button>'}).join('')+'</div>':''}
function bindGrade(){each('[data-g]',function(b){b.onclick=function(){S.grade=b.getAttribute('data-g');S.tab==='sum'?vSum():vHome()}})}
function planFor(w,room){return planG(w,gradeOf(room))}
/* ครูแทนย้อนวันได้ภายในสัปดาห์นี้เท่านั้น (Apps Script กันซ้ำอีกชั้น) */

 '<input class="pin" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><div class="err" id="err"></div>'+

/* ---------- เช็คชื่อ ---------- */
function openRoom(r,date){S.room=r;S.date=date;S.marks={};S.late=0;S.song='';S.note='';S.hist=[];S.prev=null;S.screen='check';
 // ยังส่งไม่ถึงชีต: ใช้ข้อมูลในคิวเลย
 var qd=qGet().filter(function(it){return it.data.room===r&&it.data.date===date}).pop();
 if(qd){var d=qd.data;d.students.forEach(function(s){if(s.m!=='A')S.marks[s.no]=s.m});S.late=d.late;S.song=d.song;S.note=d.note;S.prev={by:S.me.name,at:'รอส่ง'};vCheck();return}
 // ห้องที่ยังไม่มีใครบันทึกในวันนั้น: เปิดทันที ไม่ต้องรอระบบ
 var g=S.wd&&S.wd.rooms[r];if(!g||g.date!==date){vCheck();return}
 $('app').innerHTML='<div class="hint" style="padding:40px 0;text-align:center">กำลังเปิด ป.'+r+'…</div><div class="err" id="err"></div>';dock(null);
 call('load',[S.pin,r,date],function(v){if(v){S.marks=v.marks;S.late=Number(v.late)||0;S.song=v.song||'';S.note=v.note||'';S.prev={by:v.by,at:v.at}}vCheck()})}
function count(){var L=S.me.roster[S.room],x=0,b=0;L.forEach(function(s){var m=S.marks[s.no];if(m==='x')x++;else if(m==='B')b++});return{n:L.length,p:L.length-x,a:L.length-x-b,b:b+x,x:x}}

 var kids=L.map(function(s){var m=S.marks[s.no]||'A';var lab=s.nick||s.name;
  return '<div class="kid '+(m==='x'?'x':m==='B'?'B':'')+'"><button class="nm" data-k="'+s.no+'" title="'+esc(s.name)+'"><i class="dot"></i><span>'+esc(lab)+'</span><span class="no">'+s.no+'</span></button>'+
  (m==='x'?'<div class="xl">ขาด · B</div>':'<div class="ab"><button class="'+(m==='B'?'':'onA')+'" data-l="'+s.no+'" data-v="A">A</button><button class="'+(m==='B'?'onB':'')+'" data-l="'+s.no+'" data-v="B">B</button></div>')+'</div>'}).join('');
 var lates=[[0,'ตรงเวลา'],[5,'ช้า 5'],[10,'ช้า 10'],[15,'ช้า 15'],[20,'ช้า 20+']];
 $('app').innerHTML='<div class="top"><button class="btn line sm" id="back">‹</button><div class="grow"><div style="font-family:Mitr;font-size:20px">ป.'+S.room+'</div><div class="sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">สัปดาห์ที่ '+w+(p?' · '+esc(p.title):'')+'</div></div><input type="date" id="d" value="'+S.date+'"'+(weekMin()?' min="'+weekMin()+'"':'')+' max="'+S.me.today+'" style="width:150px;min-height:40px"></div>'+
 (off?'<div class="note">วันนี้อยู่ในวันงดสอน: '+esc(off.why)+' — ถ้าสอนจริงก็บันทึกได้</div>':'')+
 (S.prev?'<div class="note">บันทึกล่าสุดโดย '+esc(S.prev.by)+' · '+esc(S.prev.at)+' — กดบันทึกอีกครั้งจะแทนที่ของเดิม</div>':'')+
 '<div class="stats"><div class="stat"><div class="k">มา</div><div class="v">'+c.p+'<span style="font-size:13px;color:var(--mute)">/'+c.n+'</span></div></div><div class="stat"><div class="k">ระดับ A</div><div class="v" style="color:var(--a)">'+c.a+'</div></div><div class="stat"><div class="k">ระดับ B</div><div class="v" style="color:var(--b)">'+c.b+'</div></div></div>'+
 '<div class="chips">'+lates.map(function(l){return '<button class="chip '+(S.late===l[0]?'on':'')+'" data-t="'+l[0]+'">'+l[1]+'</button>'}).join('')+'</div>'+
 '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn line sm" id="allin">ทุกคนมา</button><button class="btn line sm" id="allA">ทุกคน A</button><button class="btn line sm" id="undo"'+(S.hist.length?'':' disabled')+'>ย้อนกลับ</button></div>'+
 '<div class="hint">แตะชื่อ = ขาด (แตะอีกครั้ง = มา) · กด B = ระดับรองลงมา · ไม่กด = A · คนขาดได้ B</div>'+

 '<label class="hint" for="song">เพลง / หัวข้อที่สอน</label><input type="text" id="song" maxlength="80" placeholder="'+esc(p?p.title:'เช่น ร้องเพลงช้างน้อย')+'" value="'+esc(S.song)+'">'+
 '<label class="hint" for="note">ปัญหา / หมายเหตุ (ไม่มีก็เว้นว่าง)</label><textarea id="note" maxlength="300" placeholder="เช่น เด็กเลขที่ 5 ไม่ยอมร้อง / โปรเจกเตอร์เสีย">'+esc(S.note)+'</textarea>'+
 '<div class="err" id="err"></div>';
 dock('<button class="btn go" id="save">บันทึก ป.'+S.room+' · '+thd(S.date)+'</button>');
